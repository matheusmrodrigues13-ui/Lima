<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #563b72, transparent 35%),
                radial-gradient(circle at 85% 80%, #245b68, transparent 35%),
                linear-gradient(135deg, #171522, #282033, #172a31);
        }

        .formulario {
            width: 520px;
            padding: 38px;

            background:
                linear-gradient(
                    145deg,
                    #292035,
                    #33243d,
                    #21373d
                );

            border: 2px solid #a66bb5;
            border-radius: 28px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                8px 8px 0 rgba(219, 105, 180, 0.25);
        }

        h2 {
            margin: 0;
            text-align: center;

            color: #f5d9ef;
            font-size: 30px;
        }

        .subtitulo {
            text-align: center;
            margin: 8px 0 30px;

            color: #b9a9bd;
            font-size: 14px;
        }

        form p {
            margin: 15px 0;
        }

        form > p {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            width: 90px;

            color: #ead7e8;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        input[type="email"] {
            flex: 1;

            padding: 12px 14px;

            border: 1px solid #6f5876;
            border-radius: 11px;

            background: #211b2b;
            color: #f4eaf5;

            outline: none;
        }

        input:focus {
            border-color: #d77fc1;
            box-shadow: 0 0 0 3px rgba(215, 127, 193, 0.12);
        }

        input::placeholder,
        textarea::placeholder {
            color: #8f8194;
        }

        .opcoes {
            margin-top: 25px;
            padding: 18px;

            background: rgba(19, 27, 34, 0.5);

            border: 1px solid #536d76;
            border-radius: 18px;
        }

        .opcoes p {
            color: #d7c9da;
            font-size: 14px;
        }

        .opcoes label {
            width: auto;
            margin-right: 8px;
        }

        .sobre {
            margin-top: 25px;
        }

        .sobre label {
            display: block;
            width: auto;
            margin-bottom: 9px;
        }

        textarea {
            width: 100%;
            height: 110px;

            padding: 13px;

            border: 1px solid #6f5876;
            border-radius: 14px;

            background: #211b2b;
            color: #f4eaf5;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #71c9d6;
            box-shadow: 0 0 0 3px rgba(113, 201, 214, 0.12);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                to right,
                #d65fae,
                #a976d1,
                #5fc3d0
            );

            color: #171522;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(214, 95, 174, 0.25);
        }
    </style>
</head>
<body>
    <div class="formulario">
        <h2>Vamos nos conhecer</h2>
        <p class="subtitulo">
            Preencha algumas informações sobre você
        </p>
        <form action="cadastro.php" method="post">
            <p>
                <label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p>
                <label>Senha:</label>
                <input type="password" name="senha" placeholder="Digite sua senha" required maxlength="8">
            </p>
            <p>
                <label>Telefone:</label>
                <input type="tel" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(99) 99999-9999" required maxlength="15" title="Digite o telefone no formato (99) 99999-9999">
            </p>
            <p>
                <label>Email:</label>
                <input type="email" name="email" placeholder="Digite seu email" required>
            </p>
            <p>
                <label>CEP:</label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required maxlength="9" title="Digite o CEP no formato 00000-000">
            </p>
            <div class="opcoes">
                <p>
                    <label>Gênero:</label>
                    <input type="radio" name="genero" value="M" required>
                    Masculino
                    <input type="radio" name="genero" value="F">
                    Feminino
                </p>
                <p>
                    <label>Interesses:</label>
                    <input type="checkbox" name="interesse" value="tecnologia">
                    Tecnologia
                    <input type="checkbox" name="interesse" value="esportes">
                    Esportes
                    <input type="checkbox" name="interesse" value="musica">
                    Música
                </p>
                <p>
                    <label>País:</label>
                    <select name="pais" required>
                        <option value="-----">-----</option>
                        <option value="Brasil">Brasil</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Noruega">Noruega</option>
                    </select>
                </p>
                <p>
                <label>Foto de Perfil:</label>
                <input type="file" name="foto">
                </p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
            <div class="sobre">
                <label>Sobre você</label>
                <textarea
                    name="sobre"
                    placeholder="Conte um pouco sobre você..."
                ></textarea>
            </div>
            <button type="submit">
                Enviar formulário
            </button>
        </form>
    </div>
</body>
</html>
