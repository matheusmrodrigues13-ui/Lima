<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        margin: 20px;
    }
    .content-box{
        background-color:aqua;
        width: 300px;
        padding: 25px;
        border: 5px solid red;
        box-sizing: content-box;
    }
    .border-box{
        background-color: gray;
        width: 300px;
        padding: 25px;
        border: 5px solid red;
        box-sizing: border-box;
    }
</style>
<body>
    <h1>Exemplos box-level e inline-level</h1>
    <p>Parágrafo é box-level, mas os <a href="#">links são inline-level</a></p>
    <h2>Box-sizing</h2>
    <div class="content-box">Content-box</div>
    <div class="border-box">Border-box</div>
</body>
</html>
