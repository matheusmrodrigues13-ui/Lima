<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores, Imagens e Links</title>
</head>
<body>
    <header>
        <h1>Cores, Imagens e Links!</h1>
    </header>
    <hr>
    <main>
        <section>
            <h2>Formatos de cor no CSS:</h2>
            <ul>
                <Li>
                    <h3 style="color: #FF5733;">Título com Cor em Hexadecimal</h3>
                </Li>
                <li>
                    <h3 style="color: rgb(0, 128, 255);">Título com Cor RGB</h3>
                </li>
                <li>
                    <h3 style="color: rgb(0, 128, 0, 0.7);">Título com Cor RGBA</h3>
                </li>
            </ul>
        </section>
        <hr>
        <section>
            <p style="color: blue;">Texto com Cor Específica!</p>
            <p style="background-color: rgb(0, 0, 0); color: rgb(255, 255, 255);">Fundo do Texto com Cor Específica!</p>
        </section> 
    </main>
    <section>
        <img src="assets/images.jpg" alt="IMG" title="IMG" height="500px" width="800px">
    </section>
    <section>
        <div style="border: 1px solid red; width: 500px; height: 500px; color: #37005c; text-align: center; border-radius: 50px;
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQF1k_X1raZaLz-tnNT4Uv_qzJajbSOlbEA8_AF8AXamBVkyCoZi6oMiRc&s=10'); background-repeat: no-repeat; background-size: contain; background-position: center;">
        <h2>Imagem como Background</h2>
        <p>Essa seção tem uma imagem de fundo</p>
        </div>
    </section>
    <hr>
    <section>
        <p>Vídeo Baixado</p>
        <video src="assets/teste.mp4" controls autoplay loop height="500" width="850"></video>
        <br>
        <p>Vídeo direto do Youtube</p>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/IRXXJFw7WiA?si=eMDYjgn3mbfGvNce" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin;"height="500" width="850; allowfullscreen"></iframe>
    </section>
    <br>
</body>
</html>
