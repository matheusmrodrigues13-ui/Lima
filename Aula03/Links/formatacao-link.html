<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Links</title>
    <style>
        body{
            background-color: black;
        }
        h1{
            color: palevioletred;
        }
        a:link{
            color:blue;
            text-decoration: none;
        }
        a:visited{
            color: yellow;
        }
        a:hover{
            color: red;
            text-decoration: underline;
            font-size: 20px;
        }
        a:active{
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Estilização Link</h1><br>
    <a href="sobre.html">Aperte Aqui</a>
</body>
</html>
